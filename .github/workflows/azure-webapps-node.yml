# 🏆 موقع همام المحارمة ونايف المحارمة 🏆

![صورة واجهة الموقع](https://via.placeholder.com/1200x600/000000/FFD700?text=همام+المحارمة+ونايف+المحارمة)

موقع شخصي فاخر يعرض تعريفاً بعائلة المحارمة بتصميم ذهبي فخم

## ✨ مميزات الموقع

- 🎨 تصميم فاخر باللونين الذهبي والأسود
- ⚔️ أيقونات سيوف ذهبية مميزة
- ✨ تأثيرات توهج ذهبية أنيقة
- 📜 شريط تمرير ذهبي متحرك
- 📱 متوافق مع جميع أحجام الشاشات
- 🚀 سرعة تحميل عالية

## 🛠️ كيفية الاستخدام

1. انسخ كود HTML كاملاً
2. أنشئ ملفاً جديداً باسم `index.html`
3. الصق الكود في الملف
4. احفظ الملف
5. افتح الملف في أي متصفح ويب

## 🎩 محتويات الموقع

- صفحة رئيسية بتعريف بعائلة المحارمة
- قائمة بكلمات وعبارات مميزة
- تصميم فريد بالسيوف الذهبية
- تأثيرات حركية عند التحويم

## 📝 كلمات الموقع المميزة

```html
<li>نحن لسنا مجرد أسماء، نحن رمز للفخامة والتميز</li>
<li>عندما يتحدث المحارمة، يصمت الجميع</li>
<li>الفخامة ليست مظهراً، بل أسلوب حياة</li>
